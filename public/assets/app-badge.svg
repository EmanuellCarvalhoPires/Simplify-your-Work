<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="appBadgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="appBadgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#appBadgeBg)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" filter="url(#appBadgeShadow)"/>

  <!-- Local App Ticket Icon (Task document + checkmark) -->
  <g transform="translate(14, 13)">
    <!-- Document Sheet -->
    <rect x="2" y="2" width="26" height="34" rx="4" fill="rgba(255, 255, 255, 0.2)" stroke="url(#iconGrad)" stroke-width="2"/>
    <!-- Document Lines -->
    <line x1="8" y1="10" x2="22" y2="10" stroke="url(#iconGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="16" x2="18" y2="16" stroke="url(#iconGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="22" x2="14" y2="22" stroke="url(#iconGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Checkmark Badge Overlay -->
    <circle cx="26" cy="26" r="10" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <path d="M 21 26 L 24.5 29.5 L 31 22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
