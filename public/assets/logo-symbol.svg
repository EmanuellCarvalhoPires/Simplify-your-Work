<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="50%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#0f0f17"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Glassmorphism Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" filter="url(#shadow)"/>

  <!-- Subtle Inner Grid / Card Background Shapes -->
  <rect x="70" y="70" width="372" height="372" rx="76" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2"/>

  <!-- Left Card Layer (Representing Tickets Atlassian / Integration) -->
  <path d="M 120 160 Q 120 140 140 140 L 260 140 Q 280 140 280 160 L 280 340 Q 280 360 260 360 L 140 360 Q 120 360 120 340 Z" fill="url(#blueGrad)" opacity="0.9" filter="url(#shadow)"/>
  
  <!-- Right Card Layer (Representing App Local Tickets) -->
  <path d="M 230 130 Q 230 110 250 110 L 370 110 Q 390 110 390 130 L 390 310 Q 390 330 370 330 L 250 330 Q 230 330 230 310 Z" fill="url(#purpleGrad)" opacity="0.85" filter="url(#shadow)"/>

  <!-- Overlapping Central Checkmark / Dynamic Workflow Node (Simplification) -->
  <g filter="url(#glow)">
    <path d="M 160 260 L 230 330 L 360 190" fill="none" stroke="url(#emeraldGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 160 260 L 230 330 L 360 190" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- Small Notification Pulse Dot -->
  <circle cx="390" cy="120" r="22" fill="#ef4444" stroke="#ffffff" stroke-width="6"/>
</svg>
